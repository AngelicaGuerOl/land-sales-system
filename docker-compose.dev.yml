services:
  frontend:
    build:
      context: ./land-sales-frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./land-sales-frontend:/app
      - land_sales_frontend_node_modules:/app/node_modules
    networks:
      - land-sales-network

volumes:
  land_sales_frontend_node_modules:
    name: land_sales_frontend_node_modules
